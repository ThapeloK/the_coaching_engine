        stroke="#0E7C86" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M 63.87 151.13 A 62 62 0 0 0 142.43 142.43"
        stroke="#5B4B8A" stroke-width="34" fill="none" stroke-linecap="round"/>
</svg>
