<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The mark, redrawn a touch heavier than the web version: a favicon is
       rendered at 16 to 32 pixels and a 30-weight stroke closes up to mush at
       that size, so the stroke is thicker and the circle slightly smaller. -->
