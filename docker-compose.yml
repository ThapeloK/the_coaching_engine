# The Coaching Engine: local stack.
#
#   docker compose up -d db      # Postgres + pgvector, schema and seed applied
#   docker compose up api        # FastAPI on :8000
#
# The frontend points at this by setting, in web/.env.local:
#   NEXT_PUBLIC_USE_REAL_API=true
#   NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ce-db
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: coaching
      POSTGRES_DB: coaching_engine
    ports:
      - "5433:5432"          # 5433 on the host, so it cannot collide with a
                             # local Postgres install
    volumes:
      - ce-pgdata:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/policies.sql:/docker-entrypoint-initdb.d/02-policies.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching_engine"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      # Repo root, matching services/api/Dockerfile: the image needs
      # services/agent as well as services/api.
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ce-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ce_app:ce_app@db:5432/coaching_engine
      # AI provider keys come from .env at the repo root. Absent keys are
      # tolerated: the deterministic endpoints work without them, and the AI
      # ones return a clear 503 rather than a stack trace.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # Synthesised guest lines, cached across restarts. The ElevenLabs free
      # tier is 10,000 characters for the life of the account, so a container
      # that forgets its cache on every rebuild would burn the budget in a
      # morning of rehearsals.
      CE_VOICE_CACHE: /voice-cache
      CE_ENV: local
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./data-generation/output:/seed:ro
      - ce-voice:/voice-cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ce-pgdata:
  ce-voice:
