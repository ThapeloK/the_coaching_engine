<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360"
     viewBox="0 0 1200 360" role="img">
<style>
  .bg   { fill: #FFFFFF; }
  .pan  { fill: #F4F6F9; stroke: #D9DFE8; stroke-width: 1; }
  .pan2 { fill: #EAEFF5; stroke: none; }
  text  { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
  .h1   { fill: #1A2233; font-size: 56px; font-weight: 700; }
  .h2   { fill: #1A2233; font-size: 26px; font-weight: 700; }
  .h3   { fill: #1A2233; font-size: 16px; font-weight: 700; }
  .tag  { fill: #0E7C86; font-size: 25px; font-style: italic;
           font-family: Georgia,'Times New Roman',serif; }
  .body { fill: #4A5568; font-size: 16px; }
  .mute { fill: #5A6B88; font-size: 13px; }
  .cap  { fill: #5A6B88; font-size: 14px; }
  .num  { font-size: 30px; font-weight: 700; }
  .lbl  { fill: #5A6B88; font-size: 12px; letter-spacing: 1.1px;
           font-weight: 600; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 13px; fill: #4A5568; }
</style>
<rect class="bg" width="1200" height="360" rx="10"/>

<rect x="60" y="46" width="230.0" height="14.0" rx="7.0" fill="#0E7C86"/>
<rect x="60" y="76.0" width="125.0" height="14.0" rx="7.0" fill="#B26A00"/>
<line x1="185.0" y1="38.0" x2="185.0" y2="100.0"
      stroke="#B26A00" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="290.0" y1="38.0" x2="290.0" y2="100.0"
      stroke="#0E7C86" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="237.0" y="118.0" text-anchor="middle"
      style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13.0px"
      fill="#B26A00">the gap</text>
<text x="60" y="182" class="h1">The Coaching Engine</text>
<text x="60" y="222" class="tag">Completion is not behaviour.</text>
<text x="60" y="256" class="body">Every learning platform measures whether training was finished.</text>
<text x="60" y="280" class="body">We measure whether the behaviour turned up on the floor.</text>
<rect x="0" y="304" width="1200" height="56" class="pan2"/>
<text x="60" y="331" class="num" fill="#A32B2B">10–20%</text>
<text x="60" y="349" class="mute">of training reaches the floor</text>
<text x="340" y="331" class="num" fill="#0E7C86">7 : 1</text>
<text x="340" y="349" class="mute">decisions by code vs by model</text>
<text x="620" y="331" class="num" fill="#2E6B3E">48</text>
<text x="620" y="349" class="mute">synthetic staff, live right now</text>
<text x="900" y="331" class="num" fill="#B26A00">0</text>
<text x="900" y="349" class="mute">uncited recommendations, ever</text>
</svg>
