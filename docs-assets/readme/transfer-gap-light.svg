<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540"
     viewBox="0 0 1200 540" role="img">
<style>
  .bg   { fill: #FFFFFF; }
  .pan  { fill: #F4F6F9; stroke: #D9DFE8; stroke-width: 1; }
  .pan2 { fill: #EAEFF5; stroke: none; }
  text  { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }
  .h1   { fill: #1A2233; font-size: 56px; font-weight: 700; }
  .h2   { fill: #1A2233; font-size: 26px; font-weight: 700; }
  .h3   { fill: #1A2233; font-size: 16px; font-weight: 700; }
  .tag  { fill: #0E7C86; font-size: 25px; font-style: italic;
           font-family: Georgia,'Times New Roman',serif; }
  .body { fill: #4A5568; font-size: 16px; }
  .mute { fill: #5A6B88; font-size: 13px; }
  .cap  { fill: #5A6B88; font-size: 14px; }
  .num  { font-size: 30px; font-weight: 700; }
  .lbl  { fill: #5A6B88; font-size: 12px; letter-spacing: 1.1px;
           font-weight: 600; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 13px; fill: #4A5568; }
</style>
<rect class="bg" width="1200" height="540" rx="10"/>

<text x="60" y="52" class="h2">The transfer gap</text>
<text x="60" y="80" class="cap">Two independent readings of one person. Where they disagree is the diagnosis.</text>
<rect x="250" y="112" width="280" height="150"
      fill="#F4F6F9"
      stroke="#D9DFE8" stroke-width="1"/>
<text x="390.0" y="172" text-anchor="middle" class="h3" fill="#5B4B8A">RECALIBRATE</text>
<text x="390.0" y="200" text-anchor="middle" class="mute">Our rubric is wrong,</text>
<text x="390.0" y="220" text-anchor="middle" class="mute">not the person</text>
<rect x="530" y="112" width="280" height="150"
      fill="#F4F6F9"
      stroke="#D9DFE8" stroke-width="1"/>
<text x="670.0" y="172" text-anchor="middle" class="h3" fill="#2E6B3E">COMPETENT</text>
<text x="670.0" y="200" text-anchor="middle" class="mute">They can do it.</text>
<text x="670.0" y="220" text-anchor="middle" class="mute">Stretch them</text>
<rect x="250" y="262" width="280" height="150"
      fill="#F4F6F9"
      stroke="#D9DFE8" stroke-width="1"/>
<text x="390.0" y="322" text-anchor="middle" class="h3" fill="#0E7C86">SKILL GAP</text>
<text x="390.0" y="350" text-anchor="middle" class="mute">Genuine gap. The only</text>
<text x="390.0" y="370" text-anchor="middle" class="mute">quadrant training fixes</text>
<rect x="530" y="262" width="280" height="150"
      fill="#FBEBD2"
      stroke="#B26A00" stroke-width="2.5"/>
<text x="670.0" y="322" text-anchor="middle" class="h3" fill="#B26A00">BLOCKED</text>
<text x="670.0" y="350" text-anchor="middle" class="mute">They already know how.</text>
<text x="670.0" y="370" text-anchor="middle" class="mute">Do NOT send training</text>
<text x="530" y="444" text-anchor="middle" class="lbl">PRACTICE SCORE &#8594;</text>
<text x="0" y="0" class="lbl" transform="translate(224,262) rotate(-90)"
      text-anchor="middle">FLOOR OBSERVATION &#8594;</text>
<rect x="880" y="118" width="272" height="88" rx="8" class="pan"/>
<rect x="898" y="138" width="5" height="48" rx="2.5" fill="#0E7C86"/>
<text x="916" y="152" class="lbl" fill="#0E7C86">STREAM 1 · PRACTICE</text>
<text x="916" y="174" class="mute">A guest scenario, scored against</text>
<text x="916" y="192" class="mute">the hotel's own rubric.</text>
<rect x="880" y="222" width="272" height="88" rx="8" class="pan"/>
<rect x="898" y="242" width="5" height="48" rx="2.5" fill="#B26A00"/>
<text x="916" y="256" class="lbl" fill="#B26A00">STREAM 2 · THE FLOOR</text>
<text x="916" y="278" class="mute">What the manager actually saw,</text>
<text x="916" y="296" class="mute">logged before they see stream 1.</text>
<rect x="880" y="326" width="272" height="88" rx="8" class="pan"/>
<rect x="898" y="346" width="5" height="48" rx="2.5" fill="#5B4B8A"/>
<text x="916" y="360" class="lbl" fill="#5B4B8A">THE GAP</text>
<text x="916" y="382" class="mute">Two readings, one person, one</text>
<text x="916" y="400" class="mute">dimension. The disagreement.</text>
<text x="60" y="490" class="cap">Nobody else can see the amber box. Every other platform watches the simulator</text>
<text x="60" y="510" class="cap">only, so the teal answer is the only answer it is able to give.</text>
</svg>
